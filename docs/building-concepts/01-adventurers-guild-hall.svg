<g transform="translate(648 181)">
  <text class="key">A　中央交叉山墙</text><text class="body" y="24">长脊蓝灰瓦；最显眼的山墙不另造假窗。</text><text class="tiny" y="44">盾徽挂在实墙上，从巷尾就能认出公会。</text>
  <text class="key" y="100">B　两扇真老虎窗</text><text class="body" y="124">从主坡屋面切出净空；高窗照入二楼。</text><text class="tiny" y="144">屋内没有夹层、阁楼地板或第三条动线。</text>
  <text class="key" y="190">C　厚柱廊 + 双扇门</text><text class="body" y="214">檐下停留再跨门槛，1.86 m 木门向内打开。</text>
  <text class="key" y="287">D　开放的石阶与门台</text><text class="body" y="311">4.38 m 三阶宽口面向市集巷，保持排队空间。</text>
</g>

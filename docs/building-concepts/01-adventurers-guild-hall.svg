<title id="title">冒险者公会 · 公共会馆建筑概念</title>
<desc id="desc">蓝灰瓦有中央山墙与两扇通向议事厅的高位老虎窗；石阶接市集巷道。一楼登记等候，右侧真梯通二楼议事与档案。</desc>
